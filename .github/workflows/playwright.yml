name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      UI_URL: http://localhost:4200
      API_URL: http://localhost:8091
    steps:
      - uses: actions/checkout@v4

      - name: Check out Toolshop app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          ref: c20ab46a59b3d42dd1d3022a8dc662114027e33f
          path: toolshop-app

      # Start the stack first so it boots while dependencies install
      - name: Start Toolshop
        working-directory: toolshop-app
        run: docker compose up -d

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # The database and Laravel need time after `up -d`, so retry until seeding succeeds
      - name: Seed database
        working-directory: toolshop-app
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed; then
              echo "Seeded on attempt $i"
              exit 0
            fi
            echo "Seed attempt $i failed; retrying in 5s"
            sleep 5
          done
          echo "Seeding failed after 30 attempts"
          exit 1

      - name: Wait for UI and API
        run: |
          for url in "$UI_URL" "$API_URL/products?page=1"; do
            echo "Waiting for $url"
            curl --silent --fail --output /dev/null \
              --retry 60 --retry-delay 5 --retry-all-errors "$url"
          done
          echo "App is ready"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          EMAIL_CUSTOMER: ${{ secrets.EMAIL_CUSTOMER }}
          PASSWORD_CUSTOMER: ${{ secrets.PASSWORD_CUSTOMER }}
          EMAIL_ADMIN: ${{ secrets.EMAIL_ADMIN }}
          PASSWORD_ADMIN: ${{ secrets.PASSWORD_ADMIN }}

      - name: Dump Toolshop logs
        if: failure()
        working-directory: toolshop-app
        run: docker compose logs

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
